const CASES=[
{t:'Extraction on an anticoagulant',box:[['Patient','58-year-old man'],['Chief complaint','“This back tooth on the lower left keeps breaking.” #19 is nonrestorable; extraction is planned.'],['Medical history','Atrial fibrillation, hypertension'],['Medications','Warfarin 5 mg daily, metoprolol 50 mg daily'],['Allergies','None known'],['Vitals','BP 136/84 mm Hg, pulse 70'],['Labs','INR 2.5, drawn this morning']],qs:[
['surg','What is the best plan for his warfarin before extracting #19?',['Continue warfarin and use local hemostatic measures','Stop warfarin 5 days before the extraction','Switch him to aspirin the week before','Postpone until his INR is below 1.5'],'With an INR in the therapeutic range (generally 3.5 or less), bleeding from a simple extraction is manageable locally: pressure, sutures, oxidized cellulose or gelatin sponge, and tranexamic acid rinse. Stopping warfarin raises his stroke risk and is never the dentist’s decision alone.','Keep the warfarin, pack the socket.'],
['pharm','Which analgesic is the best choice after the extraction?',['Acetaminophen','Ibuprofen','Naproxen','High-dose aspirin'],'NSAIDs and aspirin impair platelet function and add to warfarin’s bleeding risk. Acetaminophen is preferred at usual doses, though regular high doses over several days can raise the INR.','Warfarin + NSAID = bleeding double hit.'],
['pharm','Which antimicrobial is most likely to raise his INR significantly?',['Metronidazole','Penicillin VK','Clindamycin','Chlorhexidine rinse'],'Metronidazole and azole antifungals (such as fluconazole) inhibit CYP2C9, which clears the more potent S-warfarin, so the INR can climb sharply. Avoid them or coordinate with his physician.','Metro and the azoles make warfarin go wild.']]},
{t:'Avulsed permanent incisor',box:[['Patient','8-year-old boy'],['Chief complaint','Knocked out his upper front tooth falling off his bike 40 minutes ago'],['Tooth','#8, stored in cold milk since the accident'],['Medical history','Healthy; immunizations up to date'],['Findings','Socket intact, no other injuries. Radiographs show open (immature) apices on the maxillary incisors, including #8.']],qs:[
['surg','What should you do now?',['Rinse the root gently with saline, replant, and splint','Scrub the root clean before replanting','Don’t replant; place a space maintainer','Do root canal treatment outside the mouth, then replant'],'Extraoral dry time was minimal and the tooth was kept in a physiologic medium, so PDL cells may still be alive. Hold the tooth by the crown, rinse gently, replant with light pressure, confirm position radiographically, and splint. Never scrub the root.','Hold the crown, rinse, replant. Never scrub.'],
['surg','What splint is recommended, and for how long?',['A flexible splint for about 2 weeks','A rigid splint for 8 weeks','A flexible splint for 6 months','No splint is needed'],'IADT guidelines call for a passive, flexible splint for about 2 weeks after avulsion. Rigid or prolonged splinting encourages replacement resorption (ankylosis).','Avulsion: flexible for fourteen days.'],
['pharm','Which systemic antibiotic fits best after replantation in this child?',['Amoxicillin or penicillin V','Doxycycline','Tetracycline','None; antibiotics are never used for avulsion'],'IADT recommends systemic antibiotics after avulsion. In young children, tetracyclines risk permanent tooth discoloration, so amoxicillin or penicillin V is preferred. Also confirm tetanus status.','Kids + tetracycline = stained teeth. Use amoxicillin.'],
['endo','Because #8 has an open apex, what’s the plan for the pulp?',['Monitor for revascularization; treat only if signs of necrosis or infection appear','Start root canal treatment within 2 weeks regardless','Extract it if it doesn’t test vital at 1 week','Do a pulpectomy before splinting'],'An immature tooth replanted quickly can revascularize. Follow it closely with clinical and radiographic checks, and start endodontic treatment (regenerative endodontics or apexification) only if necrosis or infection develops. Mature teeth with closed apices get root canal treatment within about 2 weeks.','Open apex: watch and wait. Closed apex: RCT within 2 weeks.']]},
{t:'Exposed bone in a cancer patient',box:[['Patient','66-year-old woman'],['Chief complaint','“There’s a rough spot on my lower gum.”'],['Medical history','Breast cancer with bone metastases'],['Medications','IV zoledronic acid monthly for 2 years; letrozole'],['Radiation','None to the head and neck'],['Findings','6 mm area of exposed yellow-white bone on the lingual of the mandibular left molar region, present for 10 weeks. No pain, swelling, or drainage.']],qs:[
['path','What is the diagnosis?',['Medication-related osteonecrosis of the jaw (MRONJ)','Osteoradionecrosis','Acute osteomyelitis','Osteosarcoma'],'MRONJ requires current or past antiresorptive or antiangiogenic therapy, exposed bone (or bone that can be probed through a fistula) persisting more than 8 weeks, and no radiation or obvious metastatic disease to the jaws.','Antiresorptive + exposed bone over 8 weeks + no radiation = MRONJ.'],
['path','Which MRONJ stage is this?',['Stage 1','Stage 0','Stage 2','Stage 3'],'Stage 0: no exposed bone, nonspecific symptoms. Stage 1: exposed bone, no symptoms, no infection. Stage 2: exposed bone with pain and infection. Stage 3: stage 2 plus extension beyond the alveolar bone, pathologic fracture, extraoral fistula, or similar.','1 quiet, 2 infected, 3 spreading.'],
['surg','What is the best initial management?',['Antimicrobial rinse such as chlorhexidine, patient education, and close follow-up','Extensive resection with immediate reconstruction','Extract the nearby teeth to prevent spread','Tell her to stop her cancer treatment'],'Stage 1 is usually managed conservatively with antimicrobial rinses and monitoring, in coordination with the oncologist. Any change to cancer therapy is the oncologist’s call.','Stage 1: rinse, watch, and talk to the oncologist.']]},
{t:'Periodontitis in a smoker',box:[['Patient','45-year-old man'],['Chief complaint','“My gums bleed a little and some teeth feel loose.”'],['Social history','Smokes 20 cigarettes a day for 25 years'],['Medical history','None'],['Findings','28 teeth present, none lost to periodontitis. Generalized probing depths of 5–7 mm; worst interproximal CAL 6 mm. Light bleeding on probing.'],['Radiographs','Generalized horizontal bone loss to the middle third of the roots']],qs:[
['perio','What is his diagnosis under the 2017 classification?',['Generalized periodontitis, Stage III, Grade C','Localized periodontitis, Stage II, Grade A','Generalized periodontitis, Stage IV, Grade B','Generalized periodontitis, Stage I, Grade C'],'CAL of 5 mm or more, bone loss into the middle third, probing depths of 6 mm or more, and no tooth loss beyond 4 teeth = Stage III (Stage IV adds complexity such as 5 or more teeth lost or fewer than 20 remaining). Smoking 10 or more cigarettes a day makes it Grade C. More than 30% of teeth involved = generalized.','Severity sets the stage; cigarettes set the grade.'],
['perio','Why might bleeding on probing look milder than his disease suggests?',['Nicotine-related vasoconstriction masks gingival inflammation','Smoking reverses gingivitis','His bone loss is no longer active','Smoke kills periodontal pathogens'],'Smokers often show less bleeding and redness despite significant disease, so clinical signs underestimate severity. Smoking also impairs healing and the response to therapy.','Smokers bleed less but lose more.'],
['perio','What single step will most improve his prognosis?',['Smoking cessation counseling and support','Systemic antibiotics alone','Switching to a hard toothbrush','Full-mouth extractions'],'Smoking is the strongest modifiable risk factor for periodontitis and poor treatment outcomes. Use Ask, Advise, Refer alongside scaling and root planing.','Ask, Advise, Refer.']]},
{t:'Dental care during pregnancy',box:[['Patient','29-year-old woman, 24 weeks pregnant'],['Chief complaint','“This tooth hurts when I drink something cold.”'],['Medical history','Uncomplicated pregnancy; prenatal vitamins'],['Findings','Deep caries on #30 with reversible pulpitis'],['During treatment','While reclined, she says she feels lightheaded and nauseated.']],qs:[
['surg','What should you do first?',['Roll her onto her left side','Raise her legs above her head','Give epinephrine 0.3 mg IM','Have her breathe into a paper bag'],'This is supine hypotensive syndrome: the uterus compresses the inferior vena cava and reduces venous return. Turning her to the left, or wedging a pillow under her right hip, relieves it.','Pregnant and faint? Lean left.'],
['pharm','Which analgesic is preferred if she needs one?',['Acetaminophen','Ibuprofen','Naproxen','Aspirin'],'Acetaminophen is the analgesic of choice in pregnancy. The FDA advises avoiding NSAIDs from about 20 weeks on because of fetal kidney problems and low amniotic fluid; later in pregnancy they can also close the ductus arteriosus early.','Pregnancy pain: acetaminophen.'],
['surg','Which statement about her care is correct?',['Needed treatment, lidocaine with epinephrine, and diagnostic radiographs are all acceptable','All dental care must wait until after delivery','Local anesthetic with epinephrine is contraindicated','Radiographs are never allowed during pregnancy'],'The second trimester is the ideal time for routine care. Lidocaine with epinephrine is acceptable, and radiographs can be taken when diagnostically needed. Delaying needed treatment risks infection, which is worse for the pregnancy.','Second trimester = sweet spot.']]},
{t:'Cardiac patient with a recent stent',box:[['Patient','67-year-old man'],['Chief complaint','Fractured lower molar; extraction of #31 planned'],['Medical history','Myocardial infarction 5 months ago treated with a drug-eluting coronary stent; hypertension'],['Medications','Aspirin 81 mg, clopidogrel 75 mg, atorvastatin, lisinopril'],['Vitals','BP 132/80 mm Hg, pulse 68'],['Functional status','No chest pain; climbs two flights of stairs without symptoms']],qs:[
['surg','What should you do about his antiplatelet drugs?',['Continue both and control bleeding locally','Stop clopidogrel 7 days before','Stop both drugs 5 days before','Switch him to warfarin'],'Stopping dual antiplatelet therapy early after a drug-eluting stent risks stent thrombosis, which can be fatal. Extraction bleeding is usually controllable with local measures, and any change is the cardiologist’s decision.','Stents beat sockets: keep the antiplatelets.'],
['pharm','A common conservative limit on epinephrine for patients with significant cardiovascular disease is:',['0.04 mg, about two cartridges of 1:100,000','0.2 mg, about eleven cartridges','0.4 mg','There is no limit'],'The “cardiac dose” of 0.04 mg per appointment is widely used. One 1.8 mL cartridge of 1:100,000 holds 0.018 mg, so that’s about two cartridges. The healthy-adult maximum is 0.2 mg. Aspirate and inject slowly.','Cardiac = 0.04 mg = two carpules.'],
['surg','Climbing two flights of stairs without symptoms means he:',['Has at least 4 METs of functional capacity and can generally tolerate routine dental care','Has unstable angina','Shouldn’t receive any dental care','Is in class IV heart failure'],'Two flights of stairs is about 4 METs. Patients who can manage 4 METs or more without symptoms generally tolerate routine dental procedures well.','Two flights = 4 METs = OK to treat.']]},
{t:'Swelling in the lower right',box:[['Patient','38-year-old woman'],['Chief complaint','Throbbing pain in the lower right for 2 days, now with swelling'],['Medical history','None; no known allergies'],['Vitals','Temperature 98.6°F (37.0°C), pulse 76'],['Findings','#30 has a large carious lesion, no response to cold, and is very tender to percussion. Localized fluctuant swelling in the buccal vestibule. No facial swelling, trismus, or trouble swallowing.'],['Radiograph','Periapical radiolucencies at both roots of #30']],qs:[
['endo','What is the diagnosis?',['Pulp necrosis with acute apical abscess','Symptomatic irreversible pulpitis with normal apical tissues','Reversible pulpitis','Periodontal abscess on a vital tooth'],'No response to cold indicates a necrotic pulp. Rapid onset of pain and fluctuant swelling indicate an acute apical abscess, and the radiolucencies confirm periapical involvement.','No cold response + swelling = necrosis with abscess.'],
['endo','Are systemic antibiotics indicated today?',['No; drain the swelling and start definitive treatment (RCT or extraction)','Yes; antibiotics alone for 10 days before any treatment','Yes; every apical abscess needs antibiotics','Only a topical antibiotic in the canal'],'The 2019 ADA guideline: for a localized abscess without systemic signs (fever, malaise, spreading swelling, trismus), antibiotics are not recommended. Source control with incision and drainage plus pulpal debridement or extraction is the treatment.','Source control first. Antibiotics only for systemic spread.'],
['pharm','If she later develops fever and spreading swelling, the first-line oral antibiotic is:',['Amoxicillin 500 mg three times a day','Clindamycin 300 mg four times a day','Metronidazole alone','A single dose of doxycycline'],'Amoxicillin or penicillin VK is first line for odontogenic infections, usually for 3–7 days with reassessment. For penicillin allergy, options include cephalexin (if no history of anaphylaxis), azithromycin, or clindamycin. If there’s no improvement, metronidazole can be added.','Odontogenic infection: amoxicillin first.']]},
{t:'Sore mouth under a denture',box:[['Patient','74-year-old woman'],['Chief complaint','“My mouth feels sore under my upper denture.”'],['History','Wears complete dentures day and night; dentures are 15 years old'],['Medical history','Type 2 diabetes'],['Findings','Diffuse redness of the palate outlined exactly by the denture base. Folds of soft, redundant tissue in the mandibular anterior vestibule where the flange rests. Cracking and redness at both corners of the mouth.']],qs:[
['path','What is the palatal lesion?',['Denture stomatitis (chronic atrophic candidiasis)','Pseudomembranous candidiasis','Erythroplakia','Nicotine stomatitis'],'Redness confined to the denture-bearing area in a patient who wears dentures continuously is classic denture stomatitis, usually Candida-associated. Diabetes adds risk.','Red where the denture sits = denture stomatitis.'],
['pros','The folds of tissue in the anterior vestibule are most likely:',['Epulis fissuratum from an overextended flange','Squamous cell carcinoma','A mucocele','A pyogenic granuloma'],'Epulis fissuratum is reactive fibrous hyperplasia caused by an ill-fitting, overextended flange. Reduce the flange; excise and biopsy if it doesn’t resolve.','Flange too long → tissue folds.'],
['pros','What is the most important management step?',['Leave the dentures out at night, clean them daily, and use a topical antifungal','Prescribe systemic antibiotics','Add a soft liner and keep wearing them around the clock','Biopsy the entire palate'],'Removing dentures overnight, cleaning them, and treating both tissue and denture with an antifungal such as nystatin resolve most cases. Her old dentures likely need relining or replacement, which also fixes the lost vertical dimension behind her angular cheilitis.','Dentures need a bedtime too.']]},
{t:'Radiolucency around an impacted molar',box:[['Patient','24-year-old man'],['Chief complaint','Referred after a routine panoramic image; no symptoms'],['Medical history','None'],['Panoramic image','A 3 cm well-defined unilocular radiolucency around the crown of impacted #17, attached at its CEJ. The roots of #17 look darker where the mandibular canal crosses them, and the white borders of the canal are interrupted.']],qs:[
['path','What is the most likely diagnosis?',['Dentigerous cyst','Radicular cyst','Lateral periodontal cyst','Stafne bone defect'],'A pericoronal radiolucency attached at the CEJ of an unerupted tooth suggests a dentigerous cyst. An odontogenic keratocyst or unicystic ameloblastoma can look the same, which is why tissue must go for histopathology.','Holds the crown at the CEJ = dentigerous.'],
['surg','What is the appropriate treatment?',['Remove #17, enucleate the lesion, and send the tissue for biopsy','Observe with yearly radiographs','Marsupialize and leave the tooth in place permanently','Root canal treatment of #18'],'Removing the tooth and enucleating the cyst is standard; very large lesions may be decompressed first. Histopathology rules out OKC or ameloblastoma.','Every cyst wall goes to the pathologist.'],
['surg','What do the described root and canal signs suggest?',['The roots are close to the inferior alveolar canal','The tooth is ankylosed','The cyst is malignant','Normal anatomy with no added risk'],'Darkening of the root, interruption of the canal’s white lines, and diversion or narrowing of the canal suggest a close relationship with the nerve. Consider CBCT and discuss the risk of lower lip and chin numbness.','Dark root + broken white line = nerve nearby.']]},
{t:'Early childhood caries',box:[['Patient','3-year-old girl'],['Chief complaint','“Her front teeth are turning brown.”'],['History','Falls asleep with a bottle of apple juice most nights; community water isn’t fluoridated'],['Medical history','Healthy'],['Findings','Cavitated lesions on the facial and lingual surfaces of the maxillary incisors and on multiple surfaces of the primary first molars. Mandibular incisors are caries-free. Cooperates for short periods.']],qs:[
['peds','What is her caries risk and the best in-office preventive measure?',['High risk; fluoride varnish every 3 months','Low risk; brushing alone is enough','Moderate risk; sealants only','Low risk; recall in 12 months'],'Active cavitated lesions, a nighttime bottle of juice, and no community fluoride make her high risk. AAPD recommends 5% sodium fluoride varnish every 3 months for high-risk children, along with diet counseling.','High risk = varnish every 3 months.'],
['peds','What is the best restoration for primary molars with decay on several surfaces?',['Stainless steel crowns','Multi-surface amalgams','Sealants','Extraction of all affected molars'],'Stainless steel crowns are the most durable restoration for multisurface caries in primary molars, especially in high-risk children.','Many surfaces in a baby molar = steel crown.'],
['peds','Which agent can arrest the incisor lesions without drilling, if her parents accept black staining?',['38% silver diamine fluoride','2% chlorhexidine gel','Calcium hydroxide','35% hydrogen peroxide'],'SDF arrests cavitated caries, and arrested lesions turn black. It’s useful for young or uncooperative children and is usually reapplied over time. Silver allergy is a contraindication.','SDF stops decay and stains it black.']]},
{t:'Extraction after head and neck radiation',box:[['Patient','61-year-old man'],['Chief complaint','Painful broken tooth #30'],['Medical history','Squamous cell carcinoma of the tongue treated 3 years ago with surgery and 66 Gy of radiation that included the mandible'],['Findings','Very dry mouth, multiple cervical caries, #30 nonrestorable']],qs:[
['path','What is the greatest risk of extracting #30?',['Osteoradionecrosis','MRONJ','Ludwig’s angina','Pleomorphic adenoma'],'High-dose radiation, especially above 60 Gy to the mandible, leaves bone hypovascular, hypocellular, and hypoxic, so it heals poorly after trauma. The risk is lifelong. Extract as atraumatically as possible and coordinate with the radiation oncologist.','Radiated bone = hypo, hypo, hypo.'],
['bio','What mainly causes his rapid cervical caries?',['Radiation-induced loss of salivary flow','Radiation turning enamel into fluorapatite','Too much fluoride','Bruxism'],'Radiation damages the salivary glands, so buffering, clearance, and remineralization are lost. Radiation caries spreads fast along cervical and incisal areas.','No saliva, no defense.'],
['resto','What is the best daily caries prevention for him?',['Daily high-concentration fluoride, such as 1.1% NaF gel in custom trays','Avoiding fluoride entirely','Chlorhexidine once a week only','Sealants alone'],'Lifelong daily home fluoride (1.1% NaF gel or 5,000 ppm toothpaste, often in custom trays), saliva substitutes, frequent recalls, and diet control.','Dry mouth = fluoride every single day.'],
['surg','Ideally, how long before radiation should needed extractions be done?',['At least 2 weeks','1 day','6 months','They should wait until after radiation'],'Allowing about 2–3 weeks of healing before radiation begins lowers the risk of osteoradionecrosis.','Extract early: 2 weeks before the beam.']]},
{t:'Partial denture design',box:[['Patient','63-year-old man'],['Chief complaint','Wants to replace missing lower back teeth'],['Medical history','Controlled hypertension'],['Findings','Missing #17–20 and #29–32. #21–28 present and periodontally sound. Distance from the lingual gingival margin to the floor of the mouth is 6 mm. Maxillary arch fully dentate.']],qs:[
['pros','What is the Kennedy classification?',['Class I','Class II','Class III','Class IV'],'Bilateral edentulous areas posterior to the remaining teeth = Kennedy Class I, with no modification spaces here.','Both backs open = Class I.'],
['pros','In an RPI design, where should the rests on #21 and #28 be placed?',['Mesial occlusal','Distal occlusal','Cingulum','Incisal'],'In the RPI system the rest is mesial. When the distal extension base is loaded, the denture rotates around the mesial rest and the proximal plate and I-bar move away from the tooth, reducing torque on the abutment.','RPI: rest goes mesial.'],
['pros','With only 6 mm from the gingival margin to the floor of the mouth, the best major connector is a:',['Lingual plate','Lingual bar','Labial bar','Palatal strap'],'A lingual bar needs roughly 7–8 mm of vertical space (the bar itself plus clearance from the gingival margin). With less space, use a lingual plate.','Under 8 mm? Use a plate.']]}
];
CASES.forEach((c,ci)=>c.qs.forEach(q=>Q.push([...q,ci])));

const KEY="boardbite-v1";
function load(){
  try{const s=localStorage.getItem(KEY); if(s){const d=JSON.parse(s); return {boxes:d.boxes||{},best:d.best||{},cats:d.cats||null};}}catch(e){}
